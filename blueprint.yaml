name: AWS Cloud WAN Blueprints
service: AWS Cloud WAN
summary: >
  A collection of AWS Cloud WAN patterns using several IaC solutions
  that demonstrate how to configure and deploy global networks in AWS.

patterns:
  - name: Simple Architecture
    description: >
      Basic multi-region Cloud WAN setup with segments (production,
      development, shared), tag-based attachment association, and segment
      sharing between shared and workload segments. Entry point for learning
      Cloud WAN fundamentals — segments, segment actions, attachment
      policies, and isolation.
    iac: [CloudFormation, Terraform]
    sub_patterns: []

  - name: Multi-AWS Account
    description: >
      Cross-account Cloud WAN deployment that shares the core network from a
      networking account to one or more spoke accounts using AWS Resource
      Access Manager (RAM). Demonstrates centralised network management with
      distributed workloads; does not include service insertion or routing
      policies.
    iac: [CloudFormation, Terraform]
    sub_patterns: []

  - name: Traffic Inspection
    description: >
      Centralised security-inspection patterns for egress (north-south) and
      east-west traffic flows using AWS Network Firewall as the reference
      appliance. Covers single-hop and dual-hop inspection modes and
      integration with Transit Gateway for hybrid inspection topologies.
    iac: [CloudFormation, Terraform]
    sub_patterns:
      - name: Centralized Outbound
        description: >
          Egress (internet-bound) inspection in every region, with each
          spoke VPC routed to a local inspection VPC via a send-to
          service-insertion action.
      - name: Centralized Outbound (Region Without Inspection)
        description: >
          Egress inspection where a region without a local inspection VPC
          (e.g. eu-west-2) routes its outbound traffic to the nearest
          region with inspection using with-edge-overrides.
      - name: East-West (Dual-Hop)
        description: >
          Cross-region east-west traffic inspected in both the source and
          destination regions via send-via with mode dual-hop.
      - name: East-West (Single-Hop)
        description: >
          Cross-region east-west traffic inspected in exactly one region on
          its path, via send-via with mode single-hop and an inspection
          matrix defined through with-edge-overrides.
      - name: East-West with Transit Gateway (Dual-Hop)
        description: >
          Spoke VPCs attached to a Transit Gateway that peers with Cloud
          WAN; intra-region traffic is inspected by TGW inspection VPCs
          and inter-region traffic is inspected by Cloud WAN inspection
          VPCs in dual-hop mode. Terraform only.
      - name: East-West with Transit Gateway (Single-Hop)
        description: >
          Spoke VPCs attached to a Transit Gateway that peers with Cloud
          WAN, combining send-to for intra-region inspection with send-via
          single-hop for inter-region inspection.

  - name: Routing Policies
    description: >
      Advanced routing-policy capabilities providing fine-grained control
      over route filtering, summarisation, and BGP-attribute manipulation
      across segments and hybrid edges. Patterns cover route filtering,
      path preferences, and route summarisation.
    iac: [CloudFormation, Terraform]
    sub_patterns:
      - name: Filtering Secondary CIDR Blocks
        description: >
          Route filtering — drops internal-only secondary VPC CIDR blocks
          at the VPC-attachment layer so they do not propagate across the
          core network.
      - name: IPv4/IPv6 Segment Separation
        description: >
          Route filtering — creates protocol-specific segments by dropping
          IPv4 or IPv6 routes when sharing between dual-stack and
          single-stack segments.
      - name: Traffic Inspection After Filtering
        description: >
          Route filtering combined with service insertion — filters
          unwanted routes at the attachment layer before applying send-via
          dual-hop inspection between segments.
      - name: BGP Community Filtering
        description: >
          Route filtering + BGP — segments hybrid traffic by BGP community
          so a single BGP session can carry routes for multiple routing
          domains, with Cloud WAN filtering communities to the appropriate
          segments.
      - name: Hybrid Path Influence
        description: >
          Path preferences — influences inter-region traffic paths between
          AS-PATH-identical hybrid connections by prepending ASNs on
          CNE-to-CNE peerings.
      - name: Direct Connect Gateway Path Influence
        description: >
          Path preferences — influences which Direct Connect Gateway each
          regional segment prefers by prepending ASNs on hybrid-to-VPC
          sharing, letting European VPCs prefer the Europe DXGW and US
          VPCs prefer the US DXGW.
      - name: Route Summarization (Hybrid Attachments)
        description: >
          Route summarisation — aggregates VPC CIDR blocks into supernets
          before advertising to hybrid attachments, with per-region
          summaries for DXGW and a single supernet for VPN / Connect.
      - name: Filtering Peered Transit Gateways
        description: >
          Route filtering — controls which routes are exchanged between
          Cloud WAN and peered Transit Gateways, e.g. allowing only IPv6
          connectivity between regions through peered TGWs.
