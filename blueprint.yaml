name: AWS Cloud WAN Blueprints
service: AWS Cloud WAN
summary: >
  A collection of AWS Cloud WAN blueprints using several IaC solutions
  that demonstrate how to configure and deploy global networks in AWS.

# ---------------------------------------------------------------------------
# Infrastructure and policy are separate, independent trees. See V2.md for the
# reasoning.
#
#   * infra/  - deployable patterns, each defined by WHICH ATTACHMENT TYPES exist.
#               Every pattern ships a baseline.json so it deploys and forwards
#               traffic out of the box, and spans two AWS Regions.
#   * policy/ - what a Cloud WAN network policy can express, mirroring the policy
#               document's own top-level structure.
#
# There is deliberately no directory per use case: a use case is a policy
# document, and the same infrastructure serves many of them.
# ---------------------------------------------------------------------------

infra:
  - name: Basic
    path: infra/1-basic
    description: >
      Spoke VPCs across two AWS Regions attached to a Cloud WAN core network.
      The simplest infrastructure that works, and the base every other pattern
      extends. Its baseline policy demonstrates segments, tag-based attachment
      association, and non-transitive segment sharing.
    attachment_types: [vpc]
    regions: [us-east-1, eu-west-1]
    iac: [CloudFormation, Terraform]
    status: available

  - name: Inspection
    path: infra/2-inspection
    description: >
      Adds inspection VPCs with AWS Network Firewall, attached to a network
      function group. The simplest place to learn service insertion. Its
      baseline demonstrates both send-to (egress) and send-via dual-hop
      (east-west) in one document.
    attachment_types: [vpc]
    regions: [us-east-1, eu-west-1]
    iac: [CloudFormation, Terraform]
    iac_notes: >
      CloudFormation deploys in three phases, because a service-insertion action
      cannot reference a network function group that has no attachments yet.
      Both policy templates are generated from baseline.json by
      tools/sync_cfn_policy.py.
    status: available

  - name: Transit Gateway
    path: infra/3-transit_gateway
    description: >
      Adds a Transit Gateway per Region, peered with Cloud WAN, plus Transit
      Gateway route-table attachments. The coexistence and migration path, and
      the cheapest way to exercise BGP-dependent capabilities without hybrid
      connectivity.
    attachment_types: [vpc, transit-gateway-route-table]
    regions: [us-east-1, eu-west-1]
    iac: [CloudFormation, Terraform]
    status: available

  - name: Hybrid
    path: infra/4-hybrid
    description: >
      Adds hybrid connectivity - AWS Site-to-Site VPN, Connect (SD-WAN), and/or
      Direct Connect gateway - each independently optional because their
      prerequisites differ. The only pattern that unlocks the full BGP
      capability surface, including BGP communities. Also ships managed prefix
      lists for route summarization.
    attachment_types: [vpc, site-to-site-vpn, connect, direct-connect-gateway]
    regions: [us-east-1, eu-west-1]
    iac: [CloudFormation, Terraform]
    iac_notes: >
      The hybrid attachments and the managed prefix lists are Terraform-only.
      Each sub-type is enabled independently, which maps badly onto
      CloudFormation Conditions. The CloudFormation stack deploys the core
      network, the spoke VPCs, and the policy.
    status: available

  - name: Multi-account
    path: infra/5-multi_account
    description: >
      A global network, a core network, and an AWS RAM share - deliberately no
      workloads. Multi-account is a different axis from the other patterns: they
      answer which attachment types exist, this one answers who owns them. Its
      documentation covers the cross-account limitations, chiefly that
      attachment tags are set by the attachment owner.
    attachment_types: []
    regions: [us-east-1, eu-west-1]
    iac: [CloudFormation, Terraform]
    status: available

policy:
  # Each document maps 1:1 onto an area of the Cloud WAN policy document, so the
  # taxonomy is defined by the service rather than by our naming choices. It grows
  # only when AWS ships a new capability.
  - name: Building a policy
    path: policy/policy_generator.md
    produces: n/a
    description: >
      The workflow for turning a stated requirement into a validated policy
      document: intake questions, assembly order, the constraint checklist, how
      to validate, and what to hand back. Deliberately separate from SKILLS.md,
      which is the stable service reference.
    status: available

  - name: Core network configuration
    path: policy/1-core_network_configuration.md
    produces: core-network-configuration
    description: >
      Edge locations, ASN ranges, VPN ECMP, inside CIDR blocks, DNS support, and
      security group referencing.
    status: available

  - name: Segments
    path: policy/2-segments.md
    produces: segments
    description: >
      Global routing domains, attachment isolation (including its role as a
      prerequisite for intra-segment inspection), Region scoping, and attachment
      acceptance.
    status: available

  - name: Attachment policies
    path: policy/3-attachment_policies.md
    produces: attachment-policies
    description: >
      How attachments bind to segments and network function groups: rule
      numbering and evaluation order, condition types, association methods, and
      when to bind by tag versus by attachment type.
    status: available

  - name: Segment sharing
    path: policy/4-segment_sharing.md
    produces: segment-actions (share)
    description: >
      Exchanging routes between segments without inspection, why sharing is
      non-transitive, and the shared-services pattern.
    status: available

  - name: Service insertion
    path: policy/5-service_insertion.md
    produces: network-function-groups, segment-actions (send-to, send-via)
    description: >
      Traffic inspection: network function groups, egress versus east-west,
      single-hop versus dual-hop, edge overrides, and the isolation and
      appliance-mode prerequisites.
    status: available

  - name: Routing policies
    path: policy/6-routing_policies.md
    produces: routing-policies, attachment-routing-policy-rules
    description: >
      Route filtering, summarization, path preferences, and BGP communities,
      across the three association scopes (attachments, segment shares, and
      CNE-to-CNE pairs).
    status: available

# Complete, deployable policy documents. Deliberately rare - a candidate ships as
# an example only if it clears all four parts of the admission rule in
# policy/README.md. Snippets inside the documents above are the default way a use
# case is documented; policy/README.md also records the candidates that were
# rejected and why.
policy_examples:
  - name: Filter then inspect
    path: policy/examples/filter_then_inspect.json
    pattern: infra/2-inspection
    combines: [routing-policies, network-function-groups, segment-actions]
    description: >
      Drops a VPC's secondary CIDR blocks at the attachment layer, then inspects
      what remains with send-via dual-hop. The ordering matters and is the reason
      this one is an example rather than two snippets: a route filtered at the
      attachment layer never reaches the inspection path, so filtering changes
      what inspection sees.
    verify_with: >
      Set create_secondary_cidrs = true on infra/2-inspection to add the
      secondary CIDR blocks the routing policy drops.
