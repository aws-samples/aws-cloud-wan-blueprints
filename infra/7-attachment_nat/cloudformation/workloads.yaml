# ============================================================================
# The VPCs of one Region, their Cloud WAN attachments and a test instance per
# Availability Zone. Deployed once per Region (see Makefile); what each Region
# gets is keyed by Region name in Mappings.
#
# SharedVpcCIDR   - a VPC with a plain attachment, reached by its real addresses.
#                   Only Regions with an entry get one.
# AcquiredVpcCIDR - a VPC whose attachment translates CIDR to NatCidr (1:1 NAT).
#                   Every Region gets one; the CIDRs may overlap, the NAT CIDRs may not.
# ============================================================================
AWSTemplateFormatVersion: 2010-09-09
Description: AWS Cloud WAN Blueprints - 1:1 NAT on attachments (VPCs & workloads)
Transform: 'AWS::LanguageExtensions'
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # DeploySharedVpc depends on the Region. cfn-lint evaluates it for its default Region
        # only (us-east-1) and warns that the result is fixed; it is not in eu-west-1.
        - W8003

Parameters:
  CoreNetworkArn:
    Type: String
  CoreNetworkId:
    Type: String
  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"

Mappings:
  SharedVpcCIDR:
    us-east-1:
      Name: shared
      CIDR: 10.0.0.0/16
  AcquiredVpcCIDR:
    us-east-1:
      Name: acquired-a
      CIDR: 10.10.0.0/16
      NatCidr: 100.64.0.0/16
    eu-west-1:
      Name: acquired-b
      CIDR: 10.10.0.0/16
      NatCidr: 100.65.0.0/16
  # Position of each subnet among the six /28 blocks carved from a VPC's CIDR
  SubnetIndex:
    Endpoint:
      a: 0
      b: 1
    Private:
      a: 2
      b: 3
    CWAN:
      a: 4
      b: 5

Conditions:
  DeploySharedVpc: !Not [!Equals [!FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', CIDR, DefaultValue: ''], '']]

Resources:
  # ---------- SHARED VPC ----------
  SharedVPC:
    Type: AWS::EC2::VPC
    Condition: DeploySharedVpc
    Properties:
      CidrBlock: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', CIDR, DefaultValue: '']
      Tags:
        - Key: Name
          Value: !Sub
            - '${Name}-vpc-${AWS::Region}'
            - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]

  # For::Each iteration: per subnet type (Endpoint, Private, CWAN) and AZ (2 AZs)
  # Resources to create: 6 subnets, 6 route tables, 6 route table associations - obtaining AZ affinity
  'Fn::ForEach::SharedSubnetTypes':
    - SubnetType
    - [Endpoint, Private, CWAN]
    - 'Shared${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b]
          # Subnets
        - 'Shared${SubnetType}Subnet${AvailabilityZone}':
            Type: AWS::EC2::Subnet
            Condition: DeploySharedVpc
            Properties:
              VpcId: !Ref SharedVPC
              AvailabilityZone: !Sub ${AWS::Region}${AvailabilityZone}
              CidrBlock: !Select
                - !FindInMap [SubnetIndex, !Ref SubnetType, !Ref AvailabilityZone]
                - !Cidr [!GetAtt SharedVPC.CidrBlock, 6, 4]
              Tags:
                - Key: Name
                  Value: !Sub
                    - '${Name}-subnet-${SubnetType}-AZ${AvailabilityZone}'
                    - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]
          # Route Tables
          'Shared${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Condition: DeploySharedVpc
            Properties:
              VpcId: !Ref SharedVPC
              Tags:
                - Key: Name
                  Value: !Sub
                    - '${Name}-rt-${SubnetType}-AZ${AvailabilityZone}'
                    - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]
          # Route Table associations
          'Shared${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Condition: DeploySharedVpc
            Properties:
              RouteTableId: !Ref
                'Fn::Sub': 'Shared${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': 'Shared${SubnetType}Subnet${AvailabilityZone}'

  # For::Each iteration: per Availability Zone
  # Default route to the core network in the workload subnets (the VPC local route still wins for the VPC's own CIDR)
  'Fn::ForEach::SharedVPCRoutes':
    - AvailabilityZone
    - [a, b]
    - 'SharedDefaultRouteToCWAN${AvailabilityZone}':
        DependsOn:
          - SharedCWANAttachment
        Type: AWS::EC2::Route
        Condition: DeploySharedVpc
        Properties:
          RouteTableId: !Ref
            'Fn::Sub': 'SharedPrivateRouteTable${AvailabilityZone}'
          DestinationCidrBlock: 0.0.0.0/0
          CoreNetworkArn: !Ref CoreNetworkArn

  # AWS Cloud WAN attachment - no NAT, so the VPC is reached by its real addresses
  SharedCWANAttachment:
    Type: AWS::NetworkManager::VpcAttachment
    Condition: DeploySharedVpc
    Properties:
      CoreNetworkId: !Ref CoreNetworkId
      SubnetArns:
        - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SharedCWANSubneta}'
        - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SharedCWANSubnetb}'
      VpcArn: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${SharedVPC}'
      Tags:
        - Key: Name
          Value: !Sub
            - '${Name}-vpc-attachment-${AWS::Region}'
            - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]
        - Key: domain
          Value: shared

  # Security Groups (Instances and EC2 Instance Connect endpoint)
  SharedInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeploySharedVpc
    Properties:
      GroupDescription: !Sub
        - '${Name} VPC - Instance Security Group'
        - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]
      VpcId: !Ref SharedVPC

  SharedInstanceSecurityGroupIngressICMP:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: DeploySharedVpc
    Properties:
      GroupId: !Ref SharedInstanceSecurityGroup
      Description: Allow ICMP from anywhere, so cross-segment and cross-Region ping tests work
      IpProtocol: icmp
      FromPort: -1
      ToPort: -1
      CidrIp: 0.0.0.0/0

  SharedInstanceSecurityGroupIngressEIC:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: DeploySharedVpc
    Properties:
      GroupId: !Ref SharedInstanceSecurityGroup
      Description: Allowing EIC connection
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref SharedEndpointSecurityGroup

  SharedInstanceSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: DeploySharedVpc
    Properties:
      GroupId: !Ref SharedInstanceSecurityGroup
      Description: Allowing egress traffic
      IpProtocol: -1
      CidrIp: 0.0.0.0/0

  SharedEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DeploySharedVpc
    Properties:
      GroupDescription: !Sub
        - '${Name} VPC - Endpoints Security Group'
        - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]
      VpcId: !Ref SharedVPC

  SharedEndpointSecurityGroupEgressEIC:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: DeploySharedVpc
    Properties:
      GroupId: !Ref SharedEndpointSecurityGroup
      Description: Allowing EIC connection
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      DestinationSecurityGroupId: !Ref SharedInstanceSecurityGroup

  # For::Each iteration: per AZ (2 AZs)
  # EC2 Instances
  'Fn::ForEach::SharedInstances':
    - AvailabilityZone
    - [a, b]
    - 'SharedInstance${AvailabilityZone}':
        Type: AWS::EC2::Instance
        Condition: DeploySharedVpc
        Properties:
          InstanceType: t2.micro
          SecurityGroupIds:
            - !Ref SharedInstanceSecurityGroup
          SubnetId: !Ref
            'Fn::Sub': 'SharedPrivateSubnet${AvailabilityZone}'
          ImageId: !Ref LatestAmiId
          Tags:
            - Key: Name
              Value: !Sub
                - '${Name}-instance-${AvailabilityZone}'
                - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]

  # EC2 Instance Connect Endpoint
  SharedEICEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Condition: DeploySharedVpc
    Properties:
      PreserveClientIp: false
      SecurityGroupIds:
        - !Ref SharedEndpointSecurityGroup
      SubnetId: !Ref SharedEndpointSubneta
      Tags:
        - Key: Name
          Value: !Sub
            - '${Name}-eic'
            - Name: !FindInMap [SharedVpcCIDR, !Ref 'AWS::Region', Name, DefaultValue: shared]

  # ---------- ACQUIRED VPC ----------
  AcquiredVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', CIDR]
      Tags:
        - Key: Name
          Value: !Sub
            - '${Name}-vpc-${AWS::Region}'
            - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]

  # For::Each iteration: per subnet type (Endpoint, Private, CWAN) and AZ (2 AZs)
  # Resources to create: 6 subnets, 6 route tables, 6 route table associations - obtaining AZ affinity
  'Fn::ForEach::AcquiredSubnetTypes':
    - SubnetType
    - [Endpoint, Private, CWAN]
    - 'Acquired${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b]
          # Subnets
        - 'Acquired${SubnetType}Subnet${AvailabilityZone}':
            Type: AWS::EC2::Subnet
            Properties:
              VpcId: !Ref AcquiredVPC
              AvailabilityZone: !Sub ${AWS::Region}${AvailabilityZone}
              CidrBlock: !Select
                - !FindInMap [SubnetIndex, !Ref SubnetType, !Ref AvailabilityZone]
                - !Cidr [!GetAtt AcquiredVPC.CidrBlock, 6, 4]
              Tags:
                - Key: Name
                  Value: !Sub
                    - '${Name}-subnet-${SubnetType}-AZ${AvailabilityZone}'
                    - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]
          # Route Tables
          'Acquired${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Properties:
              VpcId: !Ref AcquiredVPC
              Tags:
                - Key: Name
                  Value: !Sub
                    - '${Name}-rt-${SubnetType}-AZ${AvailabilityZone}'
                    - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]
          # Route Table associations
          'Acquired${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
              RouteTableId: !Ref
                'Fn::Sub': 'Acquired${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': 'Acquired${SubnetType}Subnet${AvailabilityZone}'

  # For::Each iteration: per Availability Zone
  # Default route to the core network in the workload subnets (the VPC local route still wins for the VPC's own CIDR)
  'Fn::ForEach::AcquiredVPCRoutes':
    - AvailabilityZone
    - [a, b]
    - 'AcquiredDefaultRouteToCWAN${AvailabilityZone}':
        DependsOn:
          - AcquiredCWANAttachment
        Type: AWS::EC2::Route
        Properties:
          RouteTableId: !Ref
            'Fn::Sub': 'AcquiredPrivateRouteTable${AvailabilityZone}'
          DestinationCidrBlock: 0.0.0.0/0
          CoreNetworkArn: !Ref CoreNetworkArn

  # AWS Cloud WAN attachment - 1:1 NAT translates the VPC CIDR to its NatCidr
  AcquiredCWANAttachment:
    Type: AWS::NetworkManager::VpcAttachment
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            # The cfn-lint schema does not include NatGatewaySupport and NatGatewayRules yet.
            # Both are documented properties of AWS::NetworkManager::VpcAttachment.
            - E3002
    Properties:
      CoreNetworkId: !Ref CoreNetworkId
      SubnetArns:
        - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${AcquiredCWANSubneta}'
        - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${AcquiredCWANSubnetb}'
      VpcArn: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${AcquiredVPC}'
      NatGatewaySupport: ENABLE
      NatGatewayRules:
        - RuleNumber: 100
          MatchSourceCidr: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', CIDR]
          NatCidr: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', NatCidr]
      Tags:
        - Key: Name
          Value: !Sub
            - '${Name}-nat-attachment-${AWS::Region}'
            - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]
        - Key: domain
          Value: corporate

  # Security Groups (Instances and EC2 Instance Connect endpoint)
  AcquiredInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub
        - '${Name} VPC - Instance Security Group'
        - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]
      VpcId: !Ref AcquiredVPC

  AcquiredInstanceSecurityGroupIngressICMP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AcquiredInstanceSecurityGroup
      Description: Allow ICMP from anywhere, so cross-segment and cross-Region ping tests work
      IpProtocol: icmp
      FromPort: -1
      ToPort: -1
      CidrIp: 0.0.0.0/0

  AcquiredInstanceSecurityGroupIngressEIC:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AcquiredInstanceSecurityGroup
      Description: Allowing EIC connection
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref AcquiredEndpointSecurityGroup

  AcquiredInstanceSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AcquiredInstanceSecurityGroup
      Description: Allowing egress traffic
      IpProtocol: -1
      CidrIp: 0.0.0.0/0

  AcquiredEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub
        - '${Name} VPC - Endpoints Security Group'
        - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]
      VpcId: !Ref AcquiredVPC

  AcquiredEndpointSecurityGroupEgressEIC:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AcquiredEndpointSecurityGroup
      Description: Allowing EIC connection
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      DestinationSecurityGroupId: !Ref AcquiredInstanceSecurityGroup

  # For::Each iteration: per AZ (2 AZs)
  # EC2 Instances
  'Fn::ForEach::AcquiredInstances':
    - AvailabilityZone
    - [a, b]
    - 'AcquiredInstance${AvailabilityZone}':
        Type: AWS::EC2::Instance
        Properties:
          InstanceType: t2.micro
          SecurityGroupIds:
            - !Ref AcquiredInstanceSecurityGroup
          SubnetId: !Ref
            'Fn::Sub': 'AcquiredPrivateSubnet${AvailabilityZone}'
          ImageId: !Ref LatestAmiId
          Tags:
            - Key: Name
              Value: !Sub
                - '${Name}-instance-${AvailabilityZone}'
                - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]

  # EC2 Instance Connect Endpoint
  AcquiredEICEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      PreserveClientIp: false
      SecurityGroupIds:
        - !Ref AcquiredEndpointSecurityGroup
      SubnetId: !Ref AcquiredEndpointSubneta
      Tags:
        - Key: Name
          Value: !Sub
            - '${Name}-eic'
            - Name: !FindInMap [AcquiredVpcCIDR, !Ref 'AWS::Region', Name]

Outputs:
  SharedVpcId:
    Condition: DeploySharedVpc
    Description: Shared VPC ID.
    Value: !Ref SharedVPC
  SharedAttachmentId:
    Condition: DeploySharedVpc
    Description: Cloud WAN VPC attachment ID of the shared VPC.
    Value: !Ref SharedCWANAttachment
  AcquiredVpcId:
    Description: Acquired VPC ID.
    Value: !Ref AcquiredVPC
  AcquiredAttachmentId:
    Description: Cloud WAN VPC attachment ID of the acquired VPC, with 1:1 NAT.
    Value: !Ref AcquiredCWANAttachment
