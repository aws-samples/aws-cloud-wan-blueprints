AWSTemplateFormatVersion: 2010-09-09
Description: AWS Cloud WAN Blueprints - Inspection (global & core network)

Parameters:
  Identifier:
    Type: String
    Default: inspection
    Description: Project identifier, used as a suffix when naming resources.

Resources:
  GlobalNetwork:
    Type: AWS::NetworkManager::GlobalNetwork
    Properties:
      Description: !Sub 'Global Network - ${Identifier}'
      Tags:
        - Key: Name
          Value: !Sub 'global-network-${Identifier}'

  CoreNetwork:
    Type: AWS::NetworkManager::CoreNetwork
    Properties:
      Description: !Sub 'Core Network - ${Identifier}'
      GlobalNetworkId: !Ref GlobalNetwork
      Tags:
        - Key: Name
          Value: !Sub 'core-network-${Identifier}'
      PolicyDocument:
        version: "2025.11"
        core-network-configuration:
          vpn-ecmp-support: false
          asn-ranges:
            - 64520-64525
          edge-locations:
            - location: us-east-1
              asn: 64520
            - location: eu-west-1
              asn: 64521
        segments:
          - name: production
            require-attachment-acceptance: false
            isolate-attachments: true
          - name: development
            require-attachment-acceptance: false
            isolate-attachments: false
        network-function-groups:
          - name: inspectionVpcs
            require-attachment-acceptance: false
        attachment-policies:
          - rule-number: 100
            condition-logic: or
            conditions:
              - type: tag-value
                operator: equals
                key: inspection
                value: "true"
            action:
              add-to-network-function-group: inspectionVpcs
          - rule-number: 200
            condition-logic: and
            conditions:
              - type: attachment-type
                operator: equals
                value: vpc
              - type: tag-exists
                key: domain
            action:
              association-method: tag
              tag-value-of-key: domain
        segment-actions:
          - action: send-to
            segment: production
            via:
              network-function-groups:
                - inspectionVpcs
          - action: send-to
            segment: development
            via:
              network-function-groups:
                - inspectionVpcs
          - action: send-via
            segment: production
            mode: single-hop
            when-sent-to:
              segments:
                - development
            via:
              network-function-groups:
                - inspectionVpcs
              with-edge-overrides:
                - edge-sets:
                    - - us-east-1
                      - eu-west-1
                  use-edge-location: us-east-1

Outputs:
  CoreNetworkId:
    Description: Core Network ID.
    Value: !GetAtt CoreNetwork.CoreNetworkId
  CoreNetworkArn:
    Description: Core Network ARN.
    Value: !GetAtt CoreNetwork.CoreNetworkArn
