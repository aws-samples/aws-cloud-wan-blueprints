# ============================================================================
# The PolicyDocument below MUST match ../baseline_prefix_list.json, which is the policy this pattern shares with its Terraform implementation.
# Change one and you must change the other - CI compares them and fails the build if they diverge.
#
# This is core_network.yaml with one section added: a routing policy that matches on the prefix list ALIAS.
#
# To deploy a policy of your own, copy this template rather than editing it
# ============================================================================
AWSTemplateFormatVersion: 2010-09-09
Description: AWS Cloud WAN Blueprints - Prefix list association (global & core network, phase 3)

Parameters:
  Identifier:
    Type: String
    Default: prefix-list
    Description: Project identifier, used as a suffix when naming resources.

Resources:
  GlobalNetwork:
    Type: AWS::NetworkManager::GlobalNetwork
    Properties:
      Description: !Sub 'Global Network - ${Identifier}'
      Tags:
        - Key: Name
          Value: !Sub 'global-network-${Identifier}'

  CoreNetwork:
    Type: AWS::NetworkManager::CoreNetwork
    Properties:
      Description: !Sub 'Core Network - ${Identifier}'
      GlobalNetworkId: !Ref GlobalNetwork
      Tags:
        - Key: Name
          Value: !Sub 'core-network-${Identifier}'
      PolicyDocument:
        version: "2025.11"
        core-network-configuration:
          vpn-ecmp-support: false
          asn-ranges:
            - 64520-64525
          edge-locations:
            - location: us-east-1
              asn: 64520
            - location: eu-west-1
              asn: 64521
        segments:
          - name: vpcs
            require-attachment-acceptance: false
            isolate-attachments: false
        attachment-policies:
          - rule-number: 100
            condition-logic: and
            conditions:
              - type: attachment-type
                operator: equals
                value: vpc
              - type: tag-exists
                key: domain
            action:
              association-method: tag
              tag-value-of-key: domain
        attachment-routing-policy-rules:
          - rule-number: 100
            edge-locations:
              - us-east-1
              - eu-west-1
            conditions:
              - type: routing-policy-label
                value: vpcAttachment
            action:
              associate-routing-policies:
                - filterSecondaryRoutes
        routing-policies:
          - routing-policy-name: filterSecondaryRoutes
            routing-policy-direction: inbound
            routing-policy-number: 100
            routing-policy-rules:
              - rule-number: 100
                rule-definition:
                  match-conditions:
                    - type: prefix-in-prefix-list
                      value: routesfiltered
                  condition-logic: or
                  action:
                    type: drop

Outputs:
  CoreNetworkId:
    Description: Core Network ID.
    Value: !GetAtt CoreNetwork.CoreNetworkId
  CoreNetworkArn:
    Description: Core Network ARN.
    Value: !GetAtt CoreNetwork.CoreNetworkArn
