# ============================================================================
# The PolicyDocument below MUST match ../baseline_prefix_list.json, which is the policy this pattern shares with its Terraform implementation.
# Change one and you must change the other - CI compares them and fails the build if they diverge.
#
# This is core_network.yaml with one section added: a routing policy that matches on the prefix list ALIAS.
# Keep everything else identical: both templates deploy to the same stack, so a resource missing from one is deleted when it is applied.
#
# To deploy a policy of your own, copy this template rather than editing it
#
# Deploy this stack in us-west-2, AWS Cloud WAN's home Region: a flow log on a core network can only be created there.
# ============================================================================
AWSTemplateFormatVersion: 2010-09-09
Description: AWS Cloud WAN Blueprints - Prefix list association (global network, core network and its flow logs, phase 3)

Parameters:
  Identifier:
    Type: String
    Default: prefix-list
    Description: Project identifier, used as a suffix when naming resources.

Resources:
  GlobalNetwork:
    Type: AWS::NetworkManager::GlobalNetwork
    Properties:
      Description: !Sub 'Global Network - ${Identifier}'
      Tags:
        - Key: Name
          Value: !Sub 'global-network-${Identifier}'

  CoreNetwork:
    Type: AWS::NetworkManager::CoreNetwork
    Properties:
      Description: !Sub 'Core Network - ${Identifier}'
      GlobalNetworkId: !Ref GlobalNetwork
      Tags:
        - Key: Name
          Value: !Sub 'core-network-${Identifier}'
      PolicyDocument:
        version: "2026.10"
        core-network-configuration:
          vpn-ecmp-support: false
          asn-ranges:
            - 64520-64525
          edge-locations:
            - location: us-east-1
              asn: 64520
            - location: eu-west-1
              asn: 64521
        segments:
          - name: vpcs
            require-attachment-acceptance: false
            isolate-attachments: false
        attachment-policies:
          - rule-number: 100
            condition-logic: and
            conditions:
              - type: attachment-type
                operator: equals
                value: vpc
              - type: tag-exists
                key: domain
            action:
              association-method: tag
              tag-value-of-key: domain
        attachment-routing-policy-rules:
          - rule-number: 100
            edge-locations:
              - us-east-1
              - eu-west-1
            conditions:
              - type: routing-policy-label
                value: vpcAttachment
            action:
              associate-routing-policies:
                - filterSecondaryRoutes
        routing-policies:
          - routing-policy-name: filterSecondaryRoutes
            routing-policy-direction: inbound
            routing-policy-number: 100
            routing-policy-rules:
              - rule-number: 100
                rule-definition:
                  match-conditions:
                    - type: prefix-in-prefix-list
                      value: routesfiltered
                  condition-logic: or
                  action:
                    type: drop

  FlowLogGroup:
    # checkov:skip=CKV_AWS_158:CloudWatch Logs encrypts log data at rest by default; a customer-managed KMS key is out of scope for a demo.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/cloudwan/flow-logs/${Identifier}'
      RetentionInDays: 7

  # Role the flow logs service assumes to write to the log group. The conditions stop it being used on behalf of another account's flow logs.
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*'
      Policies:
        - PolicyName: publish-flow-logs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

  # One subscription at core network level covers every attachment, in every Region, including the ones created later.
  CoreNetworkFlowLog:
    # cfn-lint 1.60.1 ships a resource schema that predates the Cloud WAN resource types. Remove this once cfn-lint accepts CoreNetwork.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3030
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: CoreNetwork
      ResourceId: !GetAtt CoreNetwork.CoreNetworkId
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
      Tags:
        - Key: Name
          Value: !Sub 'flow-logs-${Identifier}'

Outputs:
  CoreNetworkId:
    Description: Core Network ID.
    Value: !GetAtt CoreNetwork.CoreNetworkId
  CoreNetworkArn:
    Description: Core Network ARN.
    Value: !GetAtt CoreNetwork.CoreNetworkArn
  FlowLogId:
    Description: Flow log ID.
    Value: !Ref CoreNetworkFlowLog
  FlowLogGroupName:
    Description: CloudWatch Logs log group the records are published to, one log stream per attachment.
    Value: !Ref FlowLogGroup
