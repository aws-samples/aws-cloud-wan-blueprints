AWSTemplateFormatVersion: 2010-09-09
Description: AWS Cloud WAN Summarization (Prefix lists)
Transform: 'AWS::LanguageExtensions'

Parameters:
  CoreNetworkId:
    Type: String

Resources:
    NVirginiaPrefixList:
      Type: AWS::EC2::PrefixList
      Properties:
        AddressFamily: IPv4
        Entries: 
          - Cidr: 10.10.0.0/24
            Description: prod-us-east-1
          - Cidr: 10.10.1.0/24
            Description: dev-us-east-1
        MaxEntries: 2
        PrefixListName: !Join
          - '-'
          - - nvirginia-prefix-list
            - !Ref AWS::StackName

    NVirginiaPrefixListAssociation:
      Type: AWS::NetworkManager::CoreNetworkPrefixListAssociation
      Properties:
        CoreNetworkId: !Ref CoreNetworkId
        PrefixListAlias: nvirginiaipv4routes
        PrefixListArn: !GetAtt NVirginiaPrefixList.Arn

    IrelandPrefixList:
      Type: AWS::EC2::PrefixList
      Properties:
        AddressFamily: IPv4
        Entries: 
          - Cidr: 10.0.0.0/24
            Description: prod-eu-west-1
          - Cidr: 10.0.1.0/24
            Description: dev-eu-west-1
        MaxEntries: 2
        PrefixListName: !Join
          - '-'
          - - ireland-prefix-list
            - !Ref AWS::StackName

    IrelandPrefixListAssociation:
      Type: AWS::NetworkManager::CoreNetworkPrefixListAssociation
      Properties:
        CoreNetworkId: !Ref CoreNetworkId
        PrefixListAlias: irelandipv4routes
        PrefixListArn: !GetAtt IrelandPrefixList.Arn
